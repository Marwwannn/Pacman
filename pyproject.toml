[project]
name = "pacman-backend"
version = "0.1.0"
description = "Pac-Man comme terrain de mesure pour l'IA : moteur deterministe, API temps reel, agents compares"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-cov>=5.0",
    # Rend `docs/documentation.md` en HTML imprimable (scripts/documentation_html.py).
    # Le jeu et les agents n'en dependent pas.
    "markdown>=3.6",
    # Genere le support oral `docs/presentation.pptx` (scripts/generer_presentation.py).
    # Meme statut : outil de rendu, pas une dependance du jeu.
    "python-pptx>=1.0",
]

[project.scripts]
pacman-server = "pacman.api.server:main"
pacman-rl = "pacman.rl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pacman = ["mazes/*.txt", "web/*.html", "web/*.css", "web/js/*.js", "rl/weights/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Jeu de regles fige : les regles par defaut de ruff changent d'une version a
# l'autre (0.16 a ajoute isort, bugbear, pyupgrade...), et une CI qui casse
# parce que l'outil a ete mis a jour ne dit rien sur le code.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Script de mise en page : plusieurs reglages par ligne (position, taille,
# couleur) suivent la geometrie d'une diapositive ; l'aerer disperserait ce
# qui se lit ensemble. Le style compact y est un choix, pas un oubli.
"scripts/generer_presentation.py" = ["E701", "E702"]
