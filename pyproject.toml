[project]
name = "pacman-backend"
version = "0.1.0"
description = "Pac-Man comme terrain de mesure pour l'IA : moteur deterministe, API temps reel, agents compares"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-cov>=5.0",
    # Rend `docs/documentation.md` en HTML imprimable (scripts/documentation_html.py).
    # Le jeu et les agents n'en dependent pas.
    "markdown>=3.6",
]

[project.scripts]
pacman-server = "pacman.api.server:main"
pacman-rl = "pacman.rl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pacman = ["mazes/*.txt", "web/*.html", "web/*.css", "web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
