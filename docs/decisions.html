<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pac-Man coup par coup</title>
<style>
  :root {
    --fond: #0d0f14; --carte: #161a22; --trait: #262c38;
    --texte: #e8eaf0; --doux: #9aa3b5; --jaune: #ffcc00;
    --bleu: #4da3ff; --rouge: #ff5f56; --vert: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--fond); color: var(--texte); min-height: 100vh;
    font: 400 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 1.6rem;
  }
  h1 { font-size: 1.45rem; letter-spacing: -.02em; margin-bottom: .3rem; }
  .sous { color: var(--doux); font-size: .88rem; margin-bottom: 1.3rem; }
  .sous b { color: var(--jaune); }

  .plateau { display: grid; grid-template-columns: minmax(340px, 1.05fr) minmax(310px, .95fr); gap: 1.4rem; align-items: start; max-width: 1400px; }
  @media (max-width: 900px) { .plateau { grid-template-columns: 1fr; } }

  .cadre { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 1.1rem; }
  .cadre h2 { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--jaune); margin-bottom: .8rem; }
  /* Le plateau ne doit jamais pousser les commandes sous la ligne de
     flottaison : appuyer sur « lecture » est la seule chose a faire ici. */
  svg { width: 100%; height: auto; max-height: 58vh; display: block; margin: 0 auto; }
  .colonne-droite { max-height: calc(100vh - 7rem); overflow-y: auto; }

  .commandes { display: flex; gap: .45rem; align-items: center; margin: .9rem 0 .4rem; flex-wrap: wrap; }
  button, select {
    background: var(--carte); color: var(--texte); border: 1px solid var(--trait);
    border-radius: 7px; padding: .42rem .8rem; font: inherit; font-size: .84rem; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--jaune); color: var(--jaune); }
  button:disabled { opacity: .35; cursor: default; border-color: var(--trait); color: var(--texte); }
  button.principal { border-color: var(--jaune); color: var(--jaune); min-width: 6.5rem; }
  input[type=range] { flex: 1; min-width: 150px; accent-color: var(--jaune); }

  .chiffres { display: flex; gap: 1.4rem; flex-wrap: wrap; margin-top: .7rem; font-size: .84rem; color: var(--doux); }
  .chiffres b { color: var(--texte); font-variant-numeric: tabular-nums; }
  .annonce { min-height: 1.5em; margin-top: .6rem; font-size: .88rem; color: var(--jaune); font-weight: 600; }

  .action { border: 1px solid var(--trait); border-radius: 9px; padding: .65rem .85rem; margin-bottom: .55rem; }
  .action.retenue { border-color: var(--jaune); background: rgba(255,204,0,.07); }
  .action .entete { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .action .nom { font-weight: 600; text-transform: capitalize; }
  .action.retenue .nom::after { content: " ← choisi"; color: var(--jaune); font-weight: 400; font-size: .8em; }
  .action .valeur { font-variant-numeric: tabular-nums; color: var(--jaune); font-weight: 600; }
  .action.rejetee .valeur { color: var(--doux); }
  .action .fixe { color: #5b6478; font-size: .76rem; margin-top: .45rem; }

  .terme { display: grid; grid-template-columns: 1fr auto; gap: .35rem 1rem; align-items: center; font-size: .77rem; margin-top: .4rem; }
  .terme code { color: var(--doux); font-family: Consolas, monospace; }
  .terme .apport { font-variant-numeric: tabular-nums; }
  .barre { grid-column: 1 / -1; height: 3px; background: var(--trait); border-radius: 2px; position: relative; }
  .barre i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .barre i.pos { background: var(--vert); left: 50%; }
  .barre i.neg { background: var(--rouge); right: 50%; }

  .note { color: var(--doux); font-size: .8rem; margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--trait); }
  .note b { color: var(--texte); }
</style>
</head>
<body>
<h1>L'IA joue : et on voit pourquoi</h1>
<p class="sous" id="sous"></p>

<div class="plateau">
  <div>
    <div class="cadre">
      <svg id="plan" role="img" aria-label="Partie en cours"></svg>
    </div>
    <div class="commandes">
      <button id="lecture" class="principal">▶ lecture</button>
      <button id="precD">◀ décision</button>
      <button id="suivD">décision ▶</button>
      <select id="vitesse">
        <option value="0.5">0,5 ×</option>
        <option value="1" selected>1 ×</option>
        <option value="2">2 ×</option>
        <option value="4">4 ×</option>
      </select>
      <input type="range" id="curseur" min="0" value="0">
    </div>
    <div class="chiffres" id="chiffres"></div>
    <div class="annonce" id="annonce"></div>
  </div>

  <div class="cadre colonne-droite">
    <h2>Ce que vaut chaque direction, à la dernière intersection</h2>
    <div id="actions"></div>
    <p class="note" id="note"></p>
  </div>
</div>

const COULEURS = {blinky: '#ff0000', pinky: '#ffb8ff', inky: '#00ffff', clyde: '#ffb852'};
const NOMS = ['blinky', 'pinky', 'inky', 'clyde'];
const FLECHES = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]};
const LIBELLES = {
  power_pellet: 'super-pastille avalée : les fantômes deviennent comestibles',
  ghost_eaten: 'fantôme mangé',
  fruit_eaten: 'fruit attrapé',
  pacman_died: 'attrapé : fin de la partie',
  extra_life: 'vie supplémentaire',
  level_complete: 'niveau terminé',
  frightened: 'les fantômes fuient',
};

const plan = PARTIE.plan;
const svg = document.getElementById('plan');
svg.setAttribute('viewBox', `-0.6 -0.6 ${plan.largeur + .2} ${plan.hauteur + .2}`);

// Le decor ne change jamais : on le peint une fois dans un groupe a part.
const decor = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const mobile = document.createElementNS('http://www.w3.org/2000/svg', 'g');
svg.append(decor, mobile);

let image = 0, minuteur = null, dernierTemps = 0, reste = 0;

function elem(nom, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', nom);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

for (const [x, y] of plan.murs) {
  decor.appendChild(elem('rect', {x: x - .5, y: y - .5, width: 1, height: 1, fill: '#1b2440', rx: .14}));
}
for (const [x, y] of plan.portes) {
  decor.appendChild(elem('rect', {x: x - .5, y: y - .1, width: 1, height: .2, fill: '#5b6478'}));
}

// Pastilles restantes a l'image n : on repart des initiales et on retire tout
// ce qui a ete mange jusque-la. Recalcule a chaque saut, ce qui rend le
// deplacement du curseur exact dans les deux sens.
function pastillesA(n) {
  const restantes = new Set(PARTIE.pastilles_initiales.map(p => p.join(',')));
  for (let i = 0; i <= n; i++) {
    for (const [x, y] of PARTIE.images[i].n) restantes.delete(`${x},${y}`);
  }
  return restantes;
}

function decisionA(n) {
  let trouvee = null;
  for (const d of PARTIE.decisions) {
    if (d.image <= n) trouvee = d; else break;
  }
  return trouvee;
}

const superPastilles = new Set(PARTIE.super_pastilles.map(p => p.join(',')));

function dessiner(n) {
  const img = PARTIE.images[n];
  mobile.textContent = '';

  for (const cle of pastillesA(n)) {
    const [x, y] = cle.split(',').map(Number);
    const grosse = superPastilles.has(cle);
    mobile.appendChild(elem('circle', {cx: x, cy: y, r: grosse ? .32 : .12, fill: grosse ? '#ffd9a0' : '#7d8496'}));
  }

  const d = decisionA(n);
  if (d && d.image === n) {
    for (const action of d.actions) {
      const [dx, dy] = FLECHES[action.direction];
      const retenue = action.direction === d.choix;
      mobile.appendChild(elem('line', {
        x1: img.p[0], y1: img.p[1], x2: img.p[0] + dx * 1.4, y2: img.p[1] + dy * 1.4,
        stroke: retenue ? '#ffcc00' : '#4da3ff', 'stroke-width': retenue ? .34 : .18,
        'stroke-opacity': retenue ? .85 : .35, 'stroke-linecap': 'round',
      }));
    }
  }

  img.f.forEach(([x, y, effraye], i) => {
    mobile.appendChild(elem('circle', {
      cx: x, cy: y, r: .44, fill: effraye ? '#2b4fd8' : (COULEURS[NOMS[i]] || '#ffffff'),
    }));
  });

  mobile.appendChild(elem('circle', {cx: img.p[0], cy: img.p[1], r: .46, fill: '#ffcc00'}));
}

let derniereDecisionAffichee = null;

function afficherDecision(d) {
  if (!d || d === derniereDecisionAffichee) return;
  derniereDecisionAffichee = d;

  const cible = document.getElementById('actions');
  cible.textContent = '';
  const ampleur = Math.max(...d.actions.flatMap(a =>
    (a.contributions || []).filter(c => c.discrimine).map(c => Math.abs(c.apport))), 1);

  const triees = [...d.actions].sort((a, b) =>
    (b.valeur_discriminante ?? b.valeur ?? 0) - (a.valeur_discriminante ?? a.valeur ?? 0));

  for (const action of triees) {
    const bloc = document.createElement('div');
    bloc.className = 'action ' + (action.direction === d.choix ? 'retenue' : 'rejetee');

    const entete = document.createElement('div');
    entete.className = 'entete';
    const v = action.valeur_discriminante;
    entete.innerHTML = `<span class="nom">${action.direction}</span>` +
      `<span class="valeur">${v === undefined ? '·' : (v > 0 ? '+' : '') + v.toFixed(0)}</span>`;
    bloc.appendChild(entete);

    const constants = (action.contributions || []).filter(c => !c.discrimine);
    for (const terme of (action.contributions || []).filter(c => c.discrimine).slice(0, 5)) {
      const ligne = document.createElement('div');
      ligne.className = 'terme';
      const part = Math.abs(terme.apport) / ampleur * 50;
      ligne.innerHTML =
        `<code>${terme.nom}</code><span class="apport">${terme.apport > 0 ? '+' : ''}${terme.apport.toFixed(0)}</span>` +
        `<span class="barre"><i class="${terme.apport >= 0 ? 'pos' : 'neg'}" style="width:${part}%"></i></span>`;
      bloc.appendChild(ligne);
    }

    if (constants.length) {
      const pied = document.createElement('div');
      pied.className = 'fixe';
      const somme = constants.reduce((s, c) => s + c.apport, 0);
      pied.textContent = `+ ${somme.toFixed(0)} de termes identiques pour toutes les directions ` +
        `(${constants.map(c => c.nom).join(', ')}) : ils ne départagent rien.`;
      bloc.appendChild(pied);
    }
    cible.appendChild(bloc);
  }
}

function montrer(n) {
  image = Math.max(0, Math.min(PARTIE.images.length - 1, n));
  const img = PARTIE.images[image];
  dessiner(image);

  const d = decisionA(image);
  afficherDecision(d);

  document.getElementById('curseur').value = image;
  document.getElementById('chiffres').innerHTML =
    `<span>score <b>${img.s}</b></span>` +
    `<span>tick <b>${image}</b> / ${PARTIE.images.length - 1}</span>` +
    `<span>décision <b>${d ? d.numero : 0}</b> / ${PARTIE.decisions.length}</span>` +
    `<span>pastilles restantes <b>${pastillesA(image).size}</b></span>`;

  const annonce = img.m.map(t => LIBELLES[t]).filter(Boolean);
  if (annonce.length) document.getElementById('annonce').textContent = annonce[0];
  else if (image === PARTIE.images.length - 1) {
    const f = PARTIE.final;
    document.getElementById('annonce').textContent =
      f.gagne ? 'niveau terminé' : f.mort ? 'partie terminée : attrapé' : 'fin du rejeu';
  }
}

function boucle(temps) {
  if (!minuteur) return;
  const vitesse = parseFloat(document.getElementById('vitesse').value);
  const ecoule = temps - dernierTemps;
  dernierTemps = temps;
  reste += ecoule / 1000 * 60 * vitesse;      // le moteur tourne a 60 ticks/s
  const pas = Math.floor(reste);
  if (pas > 0) {
    reste -= pas;
    if (image + pas >= PARTIE.images.length - 1) { montrer(PARTIE.images.length - 1); arreter(); return; }
    montrer(image + pas);
  }
  requestAnimationFrame(boucle);
}

function arreter() {
  minuteur = null;
  document.getElementById('lecture').textContent = '▶ lecture';
}

document.getElementById('lecture').onclick = () => {
  if (minuteur) { arreter(); return; }
  if (image >= PARTIE.images.length - 1) montrer(0);
  minuteur = true;
  reste = 0;
  dernierTemps = performance.now();
  document.getElementById('lecture').textContent = '⏸ pause';
  requestAnimationFrame(boucle);
};

function sauterDecision(sens) {
  const courante = decisionA(image);
  const numero = (courante ? courante.numero : 0) + sens;
  const cible = PARTIE.decisions.find(d => d.numero === numero);
  if (cible) { arreter(); montrer(cible.image); }
}
document.getElementById('precD').onclick = () => sauterDecision(-1);
document.getElementById('suivD').onclick = () => sauterDecision(1);
document.getElementById('curseur').oninput = e => { arreter(); montrer(+e.target.value); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { arreter(); montrer(image + 1); }
  if (e.key === 'ArrowLeft') { arreter(); montrer(image - 1); }
  if (e.key === ' ') { e.preventDefault(); document.getElementById('lecture').click(); }
});

document.getElementById('curseur').max = PARTIE.images.length - 1;

const f = PARTIE.final;
document.getElementById('sous').innerHTML =
  `Agent <b>${PARTIE.agent}</b> · graine <b>${PARTIE.graine}</b>, jamais vue à l'entraînement · ` +
  `${PARTIE.fantomes} fantômes · issue : <b>${f.gagne ? 'niveau terminé' : f.mort ? 'attrapé' : 'inachevé'}</b>, ` +
  `score final <b>${f.score}</b> en ${f.ticks} ticks`;

document.getElementById('note').innerHTML =
  `La valeur d'une direction est <b>Q(s,a) = w · f(s,a)</b> : une somme de produits ` +
  `« poids appris × descripteur ». Le chiffre affiché ne retient que les termes qui ` +
  `<b>varient d'une direction à l'autre</b> : un descripteur identique partout (le biais, ` +
  `l'avancement dans le niveau) peut peser très lourd sans jamais rien choisir. ` +
  `<b>Vert</b> : ce qui pousse à y aller. <b>Rouge</b> : ce qui retient. ` +
  `C'est ce qu'un réseau de neurones n'aurait pas permis de montrer.`;

montrer(0);
</script>
